name: Windows CI and Release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run version:check
      - run: node --test tests/version.test.mjs
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/version.mjs --tag "$env:GITHUB_REF_NAME"
      - run: npm run test:editor
      - run: cargo test --workspace --locked
      - run: npm run build

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Build unsigned Windows x64 installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Prepare installer and SHA256
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $installers = @(Get-ChildItem -LiteralPath target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $name = "xCASL2_${env:GITHUB_REF_NAME}_windows-x64-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release-artifacts/$name"
          $hash = (Get-FileHash -LiteralPath "release-artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath release-artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installer
          path: release-artifacts/*
          if-no-files-found: error
          overwrite: true
      - name: Create or update a draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to modify an already published Release.' }
          } else {
            gh release create $tag --verify-tag --title "xCASL2 $tag" --draft --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft Release.' }
          }
          $files = @(Get-ChildItem -LiteralPath release-artifacts -File | ForEach-Object FullName)
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Release assets.' }
